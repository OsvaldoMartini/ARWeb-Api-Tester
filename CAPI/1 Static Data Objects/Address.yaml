  headers:
    Content-Language:
      schema:
        type: string
    X-Has-Next-Page:
      schema:
        type: string
    Location:
      schema:
        type: string
      description: Location of the created resource
    ETag:
      schema:
        type: string
      description: Current entity-tag

  parameters:
    Filter:
      name: filter
      in: query
      description: Expression to reduce the result set
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      description: Limits the number of items on a page
      schema:
        type: integer
        default: 5
        minimum: 1
        maximum: 200
    PageOffset:
      name: offset
      in: query
      description: Number of records to be skipped before selecting the result set
      schema:
        type: integer
        minimum: 0
    HrefActive:
      name: href
      in: query
      description: Activates the href
      schema:
        type: boolean
    IncludeInactive:
      name: include_inactive
      in: query
      description: Includes inactive data
      schema:
        type: boolean
    If-None-Match:
      name: If-None-Match
      in: header
      description: Specifies version known by client
      schema:
        type: string
      required: false
    If-Match:
      name: If-Match
      in: header
      description: Specifies entity-tag known by client
      schema:
        type: string
      required: false
    Accept-Encoding:
      name: Accept-Encoding
      in: header
      description: >-
        Compression scheme<br/>
        Warning: HTTP compression might not lead to better performance
      schema:
        type: string
      example: gzip, deflate
      required: false
    Accept-Language:
      name: Accept-Language
      in: header
      description: Specifies the language and locale that the client prefers
      schema:
        type: string
      example: de-CH, en-US
      required: false
    X-Request-ID:
      name: X-Request-ID
      in: header
      description: Specifies the request id in UUID format. If not provided, it will be generated automatically.
      schema:
        type: string
        format: uuid
      required: false
  responses:
    Problem:
      description: RFC7807 Problem
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
              title:
                type: string
              status:
                type: number
                format: integer
              detail:
                type: string
              messages:
                type: array
                readOnly: true
                items:
                  type: string
              validationResults:
                type: array
                readOnly: true
                items:
                  $ref: '#/components/schemas/validationResult'
            additionalProperties: true
            required:
              - type
              - title
              - status

