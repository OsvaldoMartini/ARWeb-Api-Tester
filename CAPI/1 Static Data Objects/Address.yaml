openapi: "3.0.2"
security:
  - bearerAuth: []

info:
  title: "Address API"
  version: "3.17.3"
  x-avq$categories:
    - capi

servers:
- url: "/api1/"
  description: "Development server"

paths:
  /obj-addrs:
    get:
      tags:
      - API endpoints
      summary: Get Address objects.
      description: |
        Get a collection of `Address` objects.
        The result set can be restricted through filter parameter.
        Only `Address` objects will be returned that can be accessed by the user (security applied).
        Paging is supported with parameters *limit* and *offset*.
    
      parameters:
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      - $ref: '#/components/parameters/HrefActive'
      - $ref: '#/components/parameters/IncludeInactive'
      - $ref: '#/components/parameters/Accept-Encoding'
      - $ref: '#/components/parameters/Accept-Language'
    
      responses:
        '200':
          description: Successful response
          headers:
            Content-Language:
              $ref: '#/components/headers/Content-Language'
            X-Has-Next-Page:
              $ref: '#/components/headers/X-Has-Next-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/obj_addr'
        'default':
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - API endpoints
      summary: Create a new Address object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/obj_addr'
          application/xml:
            schema:
              $ref: '#/components/schemas/obj_addr'
      parameters:
      - $ref: '#/components/parameters/X-Request-ID'
      - $ref: '#/components/parameters/Accept-Encoding'
      responses:
        '201':
          description: Successfully created a new `Address` object
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    example: 123456
                  bdeRecVersion:
                    type: integer
                    format: int64
                    example: 1618390720445656
        '202':
          description: Successfully accepted a new `Address` object
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
        'default':
          $ref: '#/components/responses/Problem'

  /obj-addrs/{obj_addr_id}:
    get:
      tags:
      - API endpoints
      summary: "Get a Address object"
      description: |
        *Get a `Address` object by ID*.
        Only `Address` object will be returned that can be accessed by the user (security applied).
        If user does not have access to resource, not found error will be returned instead of unauthorized - to disallow attacks.
      parameters:
      - in: path
        name: obj_addr_id
        schema:
          type: string
        required: true
        description: ID of the `Address` object to get
      - $ref: '#/components/parameters/HrefActive'
      - $ref: '#/components/parameters/IncludeInactive'
      - $ref: '#/components/parameters/Accept-Encoding'
      - $ref: '#/components/parameters/If-None-Match'
      - $ref: '#/components/parameters/Accept-Language'
      responses:
        '200':
          description: Successful response
          headers:
            Content-Language:
              $ref: '#/components/headers/Content-Language'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/obj_addr'
        '304':
          description: Not modified
        'default':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - API endpoints
      summary: "Modify/update an existing Address object"
      description: |
        *Partially modify/update an existing `Address` object identified by ID*.
        Only `Address` object will be replaced that can be accessed by the user (security applied).
        If user does not have access to resource, not found error will be returned instead of unauthorized - to disallow attacks.
      parameters:
      - in: path
        name: obj_addr_id
        schema:
          type: string
        required: true
        description: ID of the `Address` object to modify/update
      - $ref: '#/components/parameters/If-Match'
      - $ref: '#/components/parameters/X-Request-ID'
      - $ref: '#/components/parameters/Accept-Encoding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/obj_addr'
      responses:
        '200':
          description: Request successfully processed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    example: 123456
                  bdeRecVersion:
                    type: integer
                    format: int64
                    example: 1618390720445656
        '202':
          description: Successfully accepted the modification of `Address` object
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
        'default':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - API endpoints
      summary: "Delete a Address object"
      description: |
        *Delete a `Address` object by ID*.
        Only `Address` object will be deleted that can be accessed by the user (security applied).
        If user does not have access to resource, not found error will be returned instead of unauthorized - to disallow attacks.
      parameters:
      - in: path
        name: obj_addr_id
        schema:
          type: string
        required: true
        description: ID of the `Address` object to modify/update
      - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: Request successfully processed
        'default':
          $ref: '#/components/responses/Problem'


components:
  securitySchemes:
    bearerAuth:            # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT    # optional, arbitrary value for documentation purposes

  schemas:
    code_tab_ref:
      title: code_tab_ref
      type: object
      properties:
        _href:
          description: "Reference/link"
          type: string
          readOnly: true
        id:
          description: "Numeric reference"
          type: integer
          format: int32
        ident:
          description: "Unique symbolic reference"
          type: string
        intlId:
          description: "Symbolic reference"
          type: string
          readOnly: true
    code_tab_ref_action:
      title: code_tab_ref_action
      type: object
      properties:
        action:
          enum: [hold, proceed, discard]
          example: hold
          description: "enum reference to action"
          type: string
          writeOnly: true
        id:
          description: "Numeric reference"
          type: integer
          format: int32
        ident:
          description: "Unique symbolic reference"
          type: string
    doc_ref:
      title: doc_ref
      type: object
      properties:
        _href:
          description: "Reference/link"
          type: string
          readOnly: true
        _ident:
          description: "Only used for workItem use cases, cross-reference in workItem context."
          type: string
          writeOnly: true
        id:
          description: "Numeric reference"
          type: integer
          format: int64
    mba_clt_onb_det:
      title: mba$clt_onb_det
      type: object
      properties:
        cltOnbDocId:
          type: number
    mba_extn:
      title: mba$extn
      type: object
      properties:
        sndLastName:
          type: string
        sndLastNameA:
          type: string
        suffix:
          type: string
        suffixA:
          type: string
    mba_intl:
      title: mba$intl
      type: object
      properties:
        cityA:
          type: boolean
        countryA:
          type: boolean
        firmA:
          type: boolean
        langA:
          type: boolean
        refAddrA:
          type: boolean
        refTypeA:
          type: boolean
        salutA:
          type: boolean
        salutLetterA:
          type: boolean
        zipA:
          type: boolean
    obj_add:
      title: obj_add
      type: object
      properties:
        boolVal:
          description: "Value"
          type: boolean
          x-additionalFieldType: extn_generic
        bu:
          description: "Business Unit<br>Referencing: `/obj-bps/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
          x-additionalFieldType: extn_generic
        dateVal:
          description: "Value"
          type: string
          format: date
          x-additionalFieldType: extn_generic
        idVal:
          description: "Value"
          type: integer
          format: int32
          x-additionalFieldType: extn_generic
        nrVal:
          description: "Value"
          type: number
          x-additionalFieldType: extn_generic
        objAdd:
          description: "Referencing: `/code-obj-adds/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
          x-additionalFieldType: extn_generic
        textVal:
          description: "Value"
          type: string
          x-additionalFieldType: extn_generic
        tswtzVal:
          description: "Value"
          type: string
          format: date-time
          x-additionalFieldType: extn_generic
        valList:
          type: array
          items:
            $ref: '#/components/schemas/obj_add_val'
          readOnly: true
          x-additionalFieldType: extn_generic
    obj_add_val:
      title: obj_add_val
      type: object
      properties:
        dateVal:
          type: string
          format: date
          readOnly: true
          x-additionalFieldType: extn_generic
        idVal:
          type: integer
          format: int32
          readOnly: true
          x-additionalFieldType: extn_generic
        nrVal:
          type: number
          readOnly: true
          x-additionalFieldType: extn_generic
        seqNr:
          type: integer
          format: int32
          readOnly: true
          x-additionalFieldType: extn_generic
        textVal:
          type: string
          readOnly: true
          x-additionalFieldType: extn_generic
        tswtzVal:
          type: string
          format: date-time
          readOnly: true
          x-additionalFieldType: extn_generic
    obj_addr:
      title: obj_addr
      type: object
      properties:
        _ident:
          description: "Only used for workItem usecases, definition of a crossreference in workItem context"
          type: string
          writeOnly: true
        addList:
          type: array
          items:
            $ref: '#/components/schemas/obj_add'
          x-additionalFieldType: extn_generic
        addrHistList:
          type: array
          items:
            $ref: '#/components/schemas/obj_addr_hist'
          readOnly: true
        addrKind:
          description: "Address Kind<br>Referencing: `/code-addr-kinds/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        addrMedium:
          description: "Address Medium<br>Referencing: `/code-addr-mediums/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        addrRole:
          description: "Address Role<br>Referencing: `/code-addr-roles/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        addrType:
          description: "Address type<br>Referencing: `/code-addr-types/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        attnOf:
          description: "Attention of"
          type: string
        bdeRecVersion:
          type: integer
          format: int64
        bldgName:
          description: "Building Name"
          type: string
        blockNr:
          description: "Block Number"
          type: string
        bu:
          description: "Business unit<br>Referencing: `/obj-bps/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
        city:
          description: "City"
          type: string
        cityLocName:
          description: "City Location Name"
          type: string
        classifList:
          type: array
          items:
            $ref: '#/components/schemas/obj_classif'
          x-additionalFieldType: extn_generic
        closeDate:
          description: "Closing date"
          type: string
          format: date
        contactBp:
          description: "Contact BP<br>Referencing: `/obj-bps/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
        contactPerson:
          description: "Contact Person<br>Referencing: `/obj-persons/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
        country:
          description: "Country<br>Referencing: `/obj-countrys/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
        countryClngCode:
          description: "Country Calling Code<br>Referencing: `/code-country-calling-codes/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        countryState:
          description: "State<br>Referencing: `/code-country-states/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        countryStateA:
          description: "Is state_id set automatically"
          type: boolean
        crof:
          description: "Care of"
          type: string
        dept:
          description: "Department"
          type: string
        district:
          description: "District"
          type: string
        doc:
          description: "Document id if the object is being modified<br>Referencing: `/docs/{id}`"
          allOf:
            - $ref: '#/components/schemas/doc_ref'
        docmRelList:
          type: array
          items:
            $ref: '#/components/schemas/obj_rel_docm'
        elAddr:
          description: "Electronic Address"
          type: string
        extn:
          $ref: '#/components/schemas/obj_addr_extn'
        firm:
          description: "Company"
          type: string
        firmA:
          description: "Company automatic flag"
          type: boolean
        firstName:
          description: "First name"
          type: string
        firstNameA:
          description: "First name automatic flag"
          type: boolean
        floorNr:
          description: "Floor Number"
          type: string
        floorType:
          description: "Floor Type<br>Referencing: `/code-floor-types/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        fullAddr:
          description: "Full address text"
          type: string
        fullAddrA:
          description: "Is full address set automatically"
          type: boolean
        govStat:
          description: "Governing status<br>Referencing: `/code-gov-stats/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        id:
          description: "ID<br>Referencing: `/objs/{id}`"
          type: integer
          format: int32
        isStdAddr:
          description: "Is Standard Address"
          type: boolean
        isVfy:
          description: "Is link verified?"
          type: boolean
        keyList:
          type: array
          items:
            $ref: '#/components/schemas/obj_key'
          x-additionalFieldType: extn_generic
        lang:
          description: "Language<br>Referencing: `/code-langs/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        langIdA:
          description: "Auto flag for Language"
          type: boolean
        lastTrans:
          $ref: '#/components/schemas/obj_trans'
        link:
          description: "Link for social network"
          type: string
        linkA:
          description: "Auto flag for link"
          type: boolean
        locality:
          description: "Locality"
          type: string
        middleName:
          description: "Middle name"
          type: string
        middleNameA:
          description: "Middle name automatic flag"
          type: boolean
        mxHybridAddr:
          description: "Address Line for MX Hybrid"
          type: string
        name:
          description: "Last name"
          type: string
        nameA:
          description: "Last name automatic flag"
          type: boolean
        nameAdd:
          description: "Name addition"
          type: string
        netwType:
          description: "Type of social network<br>Referencing: `/code-social-netw-types/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        nobTitle:
          description: "Nobility title<br>Referencing: `/code-nob-titles/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        obj:
          description: |
            Only used for workItem usecases, reference to an existing entity<br>
            Referencing: `/obj-addrs/{id}`<br>
          allOf:
            - $ref: '#/components/schemas/obj_ref'
          writeOnly: true
        objDirectRespList:
          type: array
          items:
            $ref: '#/components/schemas/obj_direct_resp_rel'
        objName:
          allOf:
            - $ref: '#/components/schemas/obj_name'
          readOnly: true
        objNameList:
          type: array
          items:
            $ref: '#/components/schemas/obj_name'
        objSubType:
          description: "Object sub-type<br>Referencing: `/code-obj-sub-types/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
          readOnly: true
        objType:
          description: "Object type<br>Referencing: `/code-obj-types/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
          readOnly: true
        openDate:
          description: "Opening date"
          type: string
          format: date
        ownerBp:
          description: "Business Partner (Owner)<br>Referencing: `/obj-bps/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
        ownerCard:
          description: "Owner<br>Referencing: `/obj-cards/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
          readOnly: true
        ownerObj:
          description: "Owner<br>Referencing: `/objs/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
        ownerPerson:
          description: "Person (Owner)<br>Referencing: `/obj-persons/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
        person:
          description: |
            **_Only visible within compound APIs_**<br>
            Referencing: `/obj-persons/{id}`<br>
            Back-property: domiAddr
          allOf:
            - $ref: '#/components/schemas/obj_ref'
          readOnly: true
        phoneAreaCode:
          description: "Phone Area Code"
          type: string
        phoneExtn:
          description: "Phone Extension"
          type: string
        phoneLoclNr:
          description: "Phone Local Number"
          type: string
        poBox:
          description: "PO-Box"
          type: string
        poBoxType:
          description: "Post Office Box Type<br>Referencing: `/code-po-box-types/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        rcvRestr:
          description: "Receiver restriction<br>Referencing: `/code-rcv-restrs/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        refAddr:
          description: "Reference address<br>Referencing: `/obj-addrs/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
        refType:
          description: "Reference type<br>Referencing: `/code-addr-ref-types/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        relList:
          type: array
          items:
            $ref: '#/components/schemas/obj_rel'
        remark:
          description: "Remark"
          type: string
        remarkList:
          type: array
          items:
            $ref: '#/components/schemas/obj_remark'
        residency:
          description: "Residency"
          type: string
        salut:
          description: "Salutation<br>Referencing: `/code-saluts/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        salutAlt:
          description: "Alternate salutation"
          type: string
        salutLetter:
          description: "Letter salutation<br>Referencing: `/code-salut-letters/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        salutLetterA:
          description: "Is letter salutation automatic?"
          type: boolean
        salutLetterAlt:
          description: "Alternate letter salutation"
          type: string
        sdsInstn:
          description: "SDS instance ID<br>Referencing: `/code-extl-syss/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        sortAlpha:
          description: "Alpha-numeric sort value"
          type: string
        sortNr:
          description: "Numeric sort value"
          type: integer
          format: int64
        state:
          description: "State"
          type: string
        street:
          description: "Street"
          type: string
        streetAdd:
          description: "Street addition"
          type: string
        streetNr:
          description: "Street Number"
          type: string
        streetType:
          description: "Street Type<br>Referencing: `/code-street-types/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        subDept:
          description: "Sub-department"
          type: string
        title:
          description: "Title<br>Referencing: `/code-titles/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        titleAlt:
          description: "Alternate title"
          type: string
        titleAltA:
          description: "Alternate title automatic flag"
          type: boolean
        titleIdA:
          description: "Title automatic flag"
          type: boolean
        transList:
          type: array
          items:
            $ref: '#/components/schemas/obj_trans'
        unitNr:
          description: "Unit Number"
          type: string
        unitType:
          description: "Unit Type<br>Referencing: `/code-unit-types/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        validStatus:
          description: "Status of address validation<br>Referencing: `/code-addr-valid-statuss/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        zip:
          description: "ZIP"
          type: string
    obj_addr_extn:
      title: obj_addr_extn
      type: object
      properties:
        addrFax:
          type: array
          items:
            $ref: '#/components/schemas/obj_key_single_'
        addrNr:
          type: array
          items:
            $ref: '#/components/schemas/obj_key_single_'
        addrSwift:
          type: array
          items:
            $ref: '#/components/schemas/obj_key_single_'
        addrSym:
          type: array
          items:
            $ref: '#/components/schemas/obj_key_single_'
        addrTlx:
          type: array
          items:
            $ref: '#/components/schemas/obj_key_single_'
        mba$addrCif:
          type: array
          items:
            $ref: '#/components/schemas/obj_key_single_'
        mba$addrLgcy:
          type: array
          items:
            $ref: '#/components/schemas/obj_key_single_'
        mba$addrUniq:
          type: array
          items:
            $ref: '#/components/schemas/obj_key_single_'
        mba$cltOnbDet:
          $ref: '#/components/schemas/mba_clt_onb_det'
        mba$extn:
          $ref: '#/components/schemas/mba_extn'
        mba$intl:
          $ref: '#/components/schemas/mba_intl'
        mba$isValid:
          $ref: '#/components/schemas/obj_classif_'
          x-additionalFieldType: extn_curr_classif
        mba$isValidHist:
          type: array
          items:
            $ref: '#/components/schemas/obj_classif_'
          readOnly: true
        sdsAddrSync:
          type: array
          items:
            $ref: '#/components/schemas/obj_key_single_'
    obj_addr_hist:
      title: obj_addr_hist
      type: object
      properties:
        addrKind:
          description: "Address Kind<br>Referencing: `/code-addr-kinds/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        addrMedium:
          description: "Address Medium<br>Referencing: `/code-addr-mediums/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        addrRole:
          description: "Address Role<br>Referencing: `/code-addr-roles/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        addrType:
          description: "Address type<br>Referencing: `/code-addr-types/{id}`"
          allOf:
            - $ref: '#/components/schemas/code_tab_ref'
        attnOf:
          description: "Attention of"
          type: string
        bldgName:
          description: "Building Name"
          type: string
        blockNr:
          description: "Block Number"
          type: string
        bu:
          description: "Business Unit<br>Referencing: `/obj-bps/{id}`"
          allOf:
            - $ref: '#/components/schemas/obj_ref'
        city:
          description: "City"
          type: string
        cityLocName:
