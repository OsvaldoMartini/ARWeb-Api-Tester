server {
    listen 80;
    server_name bank.multitest.ai ragstack.ch www.ragstack.ch;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # API proxy → Node sidecar (strip /api prefix, matching Vite dev proxy behaviour)
    location /api/ {
        proxy_pass         http://arweb-api:8787/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        # Allow large batch uploads (many OpenAPI spec files at once).
        client_max_body_size 256m;
        client_body_buffer_size 4m;
    }

    # Never cache index.html — ensures fresh JS/CSS references after deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Long-lived cache for Vite-hashed assets (safe — filenames change on rebuild)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all non-file routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
