[package]
name = "arweb-api-tester"
version = "0.1.2"
description = "ARWEB API Tester desktop shell"
authors = ["ARWEB"]
edition = "2021"

# The library is what Tauri's mobile/desktop entrypoints call into.
[lib]
name = "arweb_api_tester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

[features]
# This feature is used for production builds where assets get embedded.
custom-protocol = ["tauri/custom-protocol"]
